# Blueprint do Render: Cron Job a cada 10 minutos + Postgres para o snapshot, o histórico e os logs.
# No painel: New > Blueprint > selecione o repositório. As variáveis com sync: false são pedidas na criação.
services:
  - type: cron
    name: notifica-precos
    runtime: python
    region: virginia
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: America/Belem
      - key: DATABASE_URL
        fromDatabase:
          name: notifica-precos-db
          property: connectionString
      - key: SANKHYA_BASE_URL
        value: https://api.sankhya.com.br
      - key: SANKHYA_CLIENT_ID
        sync: false
      - key: SANKHYA_CLIENT_SECRET
        sync: false
      - key: SANKHYA_X_TOKEN
        sync: false
      - key: SANKHYA_CODTABS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORTA
        value: "587"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_SENHA
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: EMAIL_DESTINATARIOS
        sync: false
      - key: EMAIL_DEPLOY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_ITENS_EMAIL
        value: "500"
      - key: CARGA_COMPLETA_HORAS
        value: "24"
      - key: LOG_DIAS_RETENCAO
        value: "90"

databases:
  - name: notifica-precos-db
    plan: basic-256mb
    region: virginia
    databaseName: notifica_precos
    user: notifica_precos
